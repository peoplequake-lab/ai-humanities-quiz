<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="description" content="AI 앞에서 당신은 어떤 사람인가요? 7가지 질문으로 알아보는 나의 AI 활용 유형 | Peoplequake Lab">
  <meta property="og:title" content="AI 인문학 역량 검사 | Peoplequake Lab">
  <meta property="og:description" content="AI를 얼마나 잘 쓰는지가 아닌, AI 앞에서 당신이 어떤 사람인지를 보여줍니다.">
  <title>AI 인문학 역량 검사 | Peoplequake Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans KR', -apple-system, sans-serif;
      background: #0C0C0C;
      color: #F0F0F0;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    #loading {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #0C0C0C;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }

    .spinner {
      width: 36px; height: 36px;
      border: 2px solid #222;
      border-top-color: #24C699;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes pulse-line {
      0%,100% { transform: scaleY(1); }
      50%      { transform: scaleY(1.6); }
    }

    .anim-up  { animation: fadeUp  0.5s ease forwards; }
    .anim-in  { animation: fadeIn  0.4s ease forwards; }

    /* Analyzing screen */
    @keyframes grow-bar {
      from { width: 0%; }
      to   { width: 100%; }
    }
    @keyframes blink-dot {
      0%,100% { opacity: 0.2; }
      50%      { opacity: 1; }
    }
    .analyzing-screen {
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 40px 20px;
      background: radial-gradient(ellipse 80% 50% at 50% 30%, rgba(36,198,153,0.07) 0%, transparent 70%), #0C0C0C;
    }
    .analyzing-bars {
      display: flex; align-items: flex-end; gap: 4px; height: 40px; margin-bottom: 36px;
    }
    .analyzing-bars span {
      display: block; width: 4px; background: #24C699; border-radius: 2px;
      animation: pulse-line 0.8s ease-in-out infinite;
    }
    .analyzing-bars span:nth-child(1) { height: 16px; animation-delay: 0s; }
    .analyzing-bars span:nth-child(2) { height: 28px; animation-delay: 0.1s; }
    .analyzing-bars span:nth-child(3) { height: 40px; animation-delay: 0.2s; }
    .analyzing-bars span:nth-child(4) { height: 24px; animation-delay: 0.3s; }
    .analyzing-bars span:nth-child(5) { height: 36px; animation-delay: 0.4s; }
    .analyzing-bars span:nth-child(6) { height: 20px; animation-delay: 0.5s; }
    .analyzing-bars span:nth-child(7) { height: 32px; animation-delay: 0.6s; }
    .analyzing-bars span:nth-child(8) { height: 16px; animation-delay: 0.7s; }
    .analyzing-bars span:nth-child(9) { height: 26px; animation-delay: 0.8s; }
    .analyzing-title {
      font-size: 22px; font-weight: 900; color: #F0F0F0;
      margin-bottom: 10px; letter-spacing: -0.3px;
    }
    .analyzing-msg {
      font-size: 14px; color: #555; margin-bottom: 44px;
      min-height: 22px; transition: opacity 0.3s ease;
    }
    .analyzing-rail {
      width: 240px; max-width: 80vw; height: 2px;
      background: #1A1A1A; border-radius: 1px; overflow: hidden;
      margin-bottom: 20px;
    }
    .analyzing-fill {
      height: 100%; background: linear-gradient(90deg, #24C699, #1aaa80);
      border-radius: 1px;
      animation: grow-bar 2.5s cubic-bezier(0.4,0,0.2,1) forwards;
    }
    .analyzing-pct {
      font-size: 11px; color: #333; letter-spacing: 1px; font-weight: 700;
    }
    .dot-blink {
      display: inline-block;
      animation: blink-dot 1s ease-in-out infinite;
    }
    .dot-blink:nth-child(2) { animation-delay: 0.2s; }
    .dot-blink:nth-child(3) { animation-delay: 0.4s; }

    .wrap {
      max-width: 540px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* Progress */
    .prog-rail {
      position: fixed; top: 0; left: 0; right: 0; height: 2px;
      background: #1A1A1A; z-index: 100;
    }
    .prog-fill {
      height: 100%;
      background: linear-gradient(90deg, #24C699, #1aaa80);
      transition: width 0.5s ease;
    }

    /* Cover */
    .cover {
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 60px 20px;
      background: radial-gradient(ellipse 80% 50% at 50% 0%, rgba(36,198,153,0.06) 0%, transparent 70%), #0C0C0C;
    }

    .brand-pill {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(36,198,153,0.08);
      border: 1px solid rgba(36,198,153,0.25);
      border-radius: 100px; padding: 7px 18px;
      font-size: 11px; font-weight: 700; letter-spacing: 1.5px;
      color: #24C699; text-transform: uppercase;
      margin-bottom: 44px;
    }

    .quake-bars {
      display: flex; align-items: center; gap: 2px; height: 14px;
    }
    .quake-bars span {
      display: block; width: 2px; background: #24C699; border-radius: 1px;
      animation: pulse-line 1.2s ease-in-out infinite;
    }
    .quake-bars span:nth-child(1) { height: 5px;  animation-delay: 0s; }
    .quake-bars span:nth-child(2) { height: 10px; animation-delay: 0.15s; }
    .quake-bars span:nth-child(3) { height: 14px; animation-delay: 0.3s; }
    .quake-bars span:nth-child(4) { height: 8px;  animation-delay: 0.45s; }
    .quake-bars span:nth-child(5) { height: 12px; animation-delay: 0.6s; }
    .quake-bars span:nth-child(6) { height: 6px;  animation-delay: 0.75s; }
    .quake-bars span:nth-child(7) { height: 10px; animation-delay: 0.9s; }

    .cover-title {
      font-size: 36px; font-weight: 900;
      line-height: 1.25; text-align: center;
      color: #F0F0F0; margin-bottom: 14px;
      letter-spacing: -0.5px;
    }
    .cover-sub {
      font-size: 15px; color: #666; line-height: 1.7;
      text-align: center; margin-bottom: 44px;
    }

    .notice-box {
      background: #131313; border: 1px solid #1E1E1E;
      border-radius: 16px; padding: 24px;
      margin-bottom: 36px; width: 100%;
    }
    .notice-label {
      font-size: 11px; font-weight: 700; letter-spacing: 1px;
      color: #24C699; text-transform: uppercase; margin-bottom: 12px;
    }
    .notice-box p {
      font-size: 14px; color: #888; line-height: 1.8;
    }
    .notice-box strong { color: #F0F0F0; font-weight: 600; }
    .notice-box .hl { color: #24C699; font-weight: 600; }

    .badges {
      display: flex; gap: 8px; justify-content: center;
      flex-wrap: wrap; margin-bottom: 40px;
    }
    .badge {
      background: #131313; border: 1px solid #1E1E1E;
      border-radius: 100px; padding: 7px 16px;
      font-size: 12px; color: #666;
    }

    .btn-start {
      width: 100%; max-width: 320px;
      background: #24C699; color: #000;
      border: none; border-radius: 100px;
      padding: 18px 40px; font-size: 16px; font-weight: 700;
      cursor: pointer; font-family: inherit;
      transition: all 0.2s ease;
      box-shadow: 0 0 30px rgba(36,198,153,0.25);
    }
    .btn-start:hover { transform: translateY(-2px); box-shadow: 0 4px 40px rgba(36,198,153,0.4); }

    /* Question screen */
    .q-screen { min-height: 100vh; background: #0C0C0C; padding-bottom: 40px; }

    .q-header {
      padding: 28px 20px 0;
      max-width: 540px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 28px;
    }
    .q-badge {
      background: rgba(36,198,153,0.1); color: #24C699;
      border-radius: 100px; padding: 6px 16px;
      font-size: 12px; font-weight: 700;
    }
    .q-counter { font-size: 12px; color: #333; }

    .q-card {
      background: #111; border-radius: 16px; padding: 26px;
      border-left: 2px solid #24C699;
      margin-bottom: 32px;
    }
    .q-scenario {
      font-size: 14px; color: #555; line-height: 1.8;
      margin-bottom: 14px; white-space: pre-line;
    }
    .q-text {
      font-size: 19px; font-weight: 700; color: #F0F0F0; line-height: 1.4;
    }

    .options { display: flex; flex-direction: column; gap: 10px; }

    .opt {
      background: #111; border: 1.5px solid #1E1E1E;
      border-radius: 14px; padding: 18px 20px;
      cursor: pointer; text-align: left; width: 100%;
      font-family: inherit; color: #CCC; font-size: 14px; line-height: 1.7;
      transition: all 0.18s ease; display: flex; align-items: flex-start; gap: 14px;
    }
    .opt:hover:not(:disabled) { border-color: #24C699; background: rgba(36,198,153,0.06); color: #F0F0F0; }
    .opt.selected { border-color: #24C699; background: rgba(36,198,153,0.1); color: #F0F0F0; }
    .opt:disabled { opacity: 0.4; cursor: default; }
    .opt.selected:disabled { opacity: 1; }

    .opt-idx {
      flex-shrink: 0; width: 24px; height: 24px;
      border-radius: 50%; background: #1A1A1A;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700; color: #444;
      transition: all 0.18s ease; margin-top: 1px;
    }
    .opt.selected .opt-idx { background: #24C699; color: #000; }

    /* Result screen */
    .result-hero {
      background: radial-gradient(ellipse 100% 60% at 50% 0%, rgba(36,198,153,0.08) 0%, transparent 70%), #0C0C0C;
      padding: 60px 20px 40px; text-align: center;
    }
    .result-emoji { font-size: 56px; margin-bottom: 24px; display: block; }
    .result-en { font-size: 12px; color: #444; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 8px; }
    .result-ko { font-size: 30px; font-weight: 900; color: #F0F0F0; margin-bottom: 16px; letter-spacing: -0.5px; }
    .result-sub {
      display: inline-block;
      border: 1px solid rgba(36,198,153,0.3);
      border-radius: 100px; padding: 9px 22px;
      font-size: 13px; color: #24C699;
      background: rgba(36,198,153,0.08);
    }

    .result-body { padding: 0 20px 60px; }

    .r-section {
      background: #111; border: 1px solid #1A1A1A;
      border-radius: 18px; padding: 26px;
      margin-bottom: 14px;
    }
    .r-label {
      font-size: 10px; font-weight: 700; letter-spacing: 1.5px;
      color: #24C699; text-transform: uppercase; margin-bottom: 14px;
    }
    .r-body {
      font-size: 14px; color: #888; line-height: 1.9;
      white-space: pre-line;
    }

    .prog-section {
      background: linear-gradient(135deg, rgba(36,198,153,0.1), rgba(36,198,153,0.04));
      border: 1px solid rgba(36,198,153,0.2);
      border-radius: 18px; padding: 26px; margin-bottom: 14px;
    }
    .prog-title {
      font-size: 16px; font-weight: 700; color: #F0F0F0; margin-bottom: 10px;
    }
    .prog-desc { font-size: 14px; color: #888; line-height: 1.8; margin-bottom: 24px; }

    .btn-cta {
      width: 100%; background: #24C699; color: #000;
      border: none; border-radius: 100px; padding: 16px;
      font-size: 15px; font-weight: 700; cursor: pointer;
      font-family: inherit; transition: all 0.2s ease;
    }
    .btn-cta:hover { background: #1aaa80; }

    .action-row {
      display: flex; gap: 10px; margin-top: 14px;
    }
    .btn-share {
      flex: 1; background: #131313; border: 1px solid #1E1E1E;
      color: #888; border-radius: 100px; padding: 14px;
      font-size: 13px; font-weight: 600; cursor: pointer;
      font-family: inherit; transition: all 0.2s ease;
    }
    .btn-share:hover { border-color: #333; color: #CCC; }
    .btn-again {
      flex: 1; background: transparent; border: 1px solid #1E1E1E;
      color: #555; border-radius: 100px; padding: 14px;
      font-size: 13px; font-weight: 600; cursor: pointer;
      font-family: inherit; transition: all 0.2s ease;
    }
    .btn-again:hover { border-color: #333; color: #888; }

    .footer-note {
      text-align: center; margin-top: 32px;
      font-size: 11px; color: #222;
      border-top: 1px solid #141414; padding-top: 24px;
    }

    .toast {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
      background: #24C699; color: #000; font-weight: 700;
      padding: 12px 28px; border-radius: 100px; font-size: 13px;
      animation: fadeUp 0.3s ease; z-index: 9999; white-space: nowrap;
    }

    @media (max-width: 400px) {
      .cover-title { font-size: 28px; }
      .q-text { font-size: 17px; }
    }
  </style>
</head>
<body>
  <div id="loading"><div class="spinner"></div></div>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // ─── DATA ───────────────────────────────────────────────────────

    const QUESTIONS = [
      {
        id: 1,
        scenario: "기획안 마감이 1시간 남았습니다.\nAI 초안의 논리는 완벽하지만, 데이터 하나가 미세하게 다릅니다.",
        question: "당신의 선택은?",
        options: [
          { text: "미세한 오류도 신뢰도에 영향을 준다. 해당 수치를 직접 확인한 자료로 교체하고 제출한다", type: "isolated" },
          { text: "AI에게 해당 데이터를 재검증하도록 추가 질문하고, 교차 확인된 수치로 즉시 수정해 제출한다", type: "creative" },
          { text: "이미 검증된 유사 프로젝트 데이터를 참고해 해당 부분만 교체하는 것이 가장 안전하다고 판단하고 제출한다", type: "defensive" },
          { text: "논리 구조가 완성된 초안에서 미세한 수치 차이는 허용 범위다. AI 결과물을 마무리해 제출한다", type: "cognitive" },
        ]
      },
      {
        id: 2,
        scenario: "새로운 프로젝트 네이밍을 10개 제안해야 합니다.",
        question: "평소 아이디어를 만드는 방식과 가장 가까운 것은?",
        options: [
          { text: "시장에서 검증된 네이밍 패턴과 성공 사례를 분석하고, 그 안에서 변형된 안을 제안한다", type: "defensive" },
          { text: "레퍼런스 자료와 팀의 축적된 아이디어를 기반으로, 고유성이 담긴 후보를 직접 구성해 제안한다", type: "isolated" },
          { text: "AI에게 초안을 받되, 키워드를 융합하거나 2~3차례 추가 질문으로 아이디어를 심화시켜 제안한다", type: "creative" },
          { text: "AI에게 조건을 상세히 입력하고, 출력된 결과 중 목적에 가장 부합하는 것을 선별해 제안한다", type: "cognitive" },
        ]
      },
      {
        id: 3,
        scenario: "마감을 자주 어기는 팀원이 있습니다.",
        question: "따끔하지만 상처 주지 않는 피드백 이메일, 어떻게 쓰시나요?",
        options: [
          { text: "전달할 핵심 내용을 먼저 직접 구성하고, AI에게 문장 다듬기를 요청해 최종 검토 후 발송한다", type: "creative" },
          { text: "조직 내 검증된 피드백 템플릿과 유사 사례를 참고해 상황에 맞게 수정한 뒤 발송한다", type: "defensive" },
          { text: "미묘한 뉘앙스가 관계에 영향을 주는 소통인 만큼, AI 초안은 참고에 그치고 나의 언어로 직접 작성해 발송한다", type: "isolated" },
          { text: "전달할 사실과 원하는 톤을 명확히 지정해 AI에게 초안을 작성하게 하고, 내용을 검토한 뒤 발송한다", type: "cognitive" },
        ]
      },
      {
        id: 4,
        scenario: "나의 업무를 자동화해 준다는 획기적인 AI가 출시되었습니다.",
        question: "당신의 가장 자연스러운 첫 반응은?",
        options: [
          { text: "도입 전 품질·보안 리스크를 먼저 검토하고, 충분한 확인이 끝난 뒤 도입 여부를 결정한다", type: "isolated" },
          { text: "반복 업무를 빠르게 위임해 시간 자원을 확보하는 것이 우선이다. 즉시 도입하고 활용 범위를 넓혀간다", type: "cognitive" },
          { text: "내부 지침이나 주변의 활용 사례가 충분히 쌓이면, 그에 맞춰 점진적으로 적용해 본다", type: "defensive" },
          { text: "직접 써보면서 내 업무 중 어디에 얼마나 적합한지를 파악하고, 활용 범위를 스스로 설계한다", type: "creative" },
        ]
      },
      {
        id: 5,
        scenario: "내 경험을 바탕으로 AI가 완벽하고 감동적인 글을 써주었습니다.\n좌절감 등 일부 감정이 다소 미화되었다면?",
        question: "당신은 어떻게 하나요?",
        options: [
          { text: "독자에게 닿는 것이 목적이다. 더 설득력 있게 다듬어진 AI 버전을 선택하는 것이 합리적이라 판단한다", type: "cognitive" },
          { text: "구조와 논리는 AI 것을 활용하되, 감정과 맥락은 투박하더라도 나의 실제 언어로 다시 고쳐 쓴다", type: "creative" },
          { text: "내 경험에 대한 해석권은 내게 있다. AI 버전은 참고에 그치고, 처음부터 내 언어로 직접 쓴다", type: "isolated" },
          { text: "업계에서 검증된 글쓰기 형식을 기반으로, 내 이야기를 그 구조 안에서 안전하게 담아낸다", type: "defensive" },
        ]
      },
      {
        id: 6,
        scenario: "AI가 수익성이 높은 타겟팅 전략을 설계했습니다.\n그런데 이 전략이 특정 취약 계층의 접근성을 배제하고 있다는 걸 알게 됐다면?",
        question: "당신의 판단은?",
        options: [

        const el = document.createElement('textarea');
        el.value = text; document.body.appendChild(el);
        el.select(); document.execCommand('copy');
        document.body.removeChild(el);
      };

      return (
        <div>
          <div className="result-hero anim-up">
            <div className="brand-pill" style={{ marginBottom: '32px' }}>
              <div className="quake-bars">
                <span/><span/><span/><span/><span/><span/><span/>
              </div>
              Peoplequake Lab
            </div>
            <span className="result-emoji">{r.emoji}</span>
            <p className="result-en">{r.en}</p>
            <h1 className="result-ko">{r.ko}</h1>
            <span className="result-sub">{r.sub}</span>
          </div>

          <div className="result-body wrap anim-in">
            <div className="r-section">
              <div className="r-label">👓 분석 리포트</div>
              <p className="r-body">{r.report}</p>
            </div>

            <div className="r-section">
              <div className="r-label">⛑ AI 리터러시 진단</div>
              <p className="r-body">{r.literacy}</p>
            </div>

            <div className="r-section">
              <div className="r-label">☺️ Peoplequake Lab의 처방전</div>
              <p className="r-body">{r.prescription}</p>
            </div>

            <div className="r-section">
              <div className="r-label">🧙‍♀️ Peoplequake Lab 커리어 코칭</div>
              <p className="r-body">{r.coaching}</p>
            </div>

            <div className="prog-section">
              <div className="r-label">👌 추천 프로그램</div>
              <p className="prog-title">{r.program}</p>
              <p className="prog-desc">{r.programDesc}</p>
              <button className="btn-cta" onClick={() => window.open('https://peoplequakelab.com', '_blank')}>
                프로그램 신청하기 →
              </button>
            </div>

            <div className="action-row">
              <button className="btn-share" onClick={share}>🔗 링크 공유</button>
              <button className="btn-again" onClick={onRestart}>↺ 다시 검사</button>
            </div>

            <div className="footer-note">© 2025 Peoplequake Lab. All rights reserved.</div>
          </div>

          {toast && <div className="toast">✓ 링크가 복사되었습니다!</div>}
        </div>
      );
    };

    // ─── ANALYZING SCREEN ───────────────────────────────────────────

    const MESSAGES = [
      "7개의 응답 패턴을 분석하고 있습니다",
      "AI 리터러시 유형을 분류하고 있습니다",
      "당신만의 유형을 도출하고 있습니다",
      "분석이 완료되었습니다",
    ];

    const AnalyzingScreen = ({ onDone }) => {
      const [msgIdx, setMsgIdx] = useState(0);
      const [pct, setPct]       = useState(0);

      useEffect(() => {
        window.scrollTo(0, 0);
        // Cycle messages every 620ms
        const msgTimer = setInterval(() => {
          setMsgIdx(i => Math.min(i + 1, MESSAGES.length - 1));
        }, 620);
        // Smooth percentage counter over 2.4s
        const start = Date.now();
        const pctTimer = setInterval(() => {
          const elapsed = Date.now() - start;
          const p = Math.min(Math.round((elapsed / 2400) * 100), 100);
          setPct(p);
          if (p >= 100) clearInterval(pctTimer);
        }, 30);
        // Transition to result after 2.5s
        const doneTimer = setTimeout(onDone, 2500);
        return () => {
          clearInterval(msgTimer);
          clearInterval(pctTimer);
          clearTimeout(doneTimer);
        };
      }, []);

      return (
        <div className="analyzing-screen anim-in">
          <div className="analyzing-bars">
            <span/><span/><span/><span/><span/><span/><span/><span/><span/>
          </div>
          <h2 className="analyzing-title">결과 분석 중</h2>
          <p className="analyzing-msg">
            {MESSAGES[msgIdx]}
            <span className="dot-blink">.</span>
            <span className="dot-blink">.</span>
            <span className="dot-blink">.</span>
          </p>
          <div className="analyzing-rail">
            <div className="analyzing-fill" />
          </div>
          <p className="analyzing-pct">{pct}%</p>
        </div>
      );
    };

    // ─── SCORING ────────────────────────────────────────────────────

    const calcResult = (answers) => {
      const s = { creative: 0, cognitive: 0, isolated: 0, defensive: 0 };
      answers.forEach(t => s[t]++);
      const max = Math.max(...Object.values(s));
      const tops = Object.keys(s).filter(k => s[k] === max);
      if (tops.length === 1) return tops[0];
      return answers.find(t => tops.includes(t));
    };

    // ─── APP ────────────────────────────────────────────────────────

    const App = () => {
      const [screen, setScreen]     = useState('cover');
      const [qIdx, setQIdx]         = useState(0);
      const [answers, setAnswers]   = useState([]);
      const [chosen, setChosen]     = useState(null);
      const [finalAnswers, setFinalAnswers] = useState([]);

      useEffect(() => {
        const el = document.getElementById('loading');
        if (el) { el.classList.add('hidden'); setTimeout(() => el.remove(), 400); }
      }, []);

      const handleAnswer = (type) => {
        if (chosen !== null) return;
        setChosen(type);
        setTimeout(() => {
          const next = [...answers, type];
          setAnswers(next);
          setChosen(null);
          if (qIdx < QUESTIONS.length - 1) {
            setQIdx(qIdx + 1);
          } else {
            // Last question → go to analyzing screen, save final answers
            setFinalAnswers(next);
            setScreen('analyzing');
          }
        }, 480);
      };

      const restart = () => {
        setScreen('cover'); setQIdx(0);
        setAnswers([]); setFinalAnswers([]); setChosen(null);
        window.scrollTo(0, 0);
      };

      if (screen === 'cover')     return <CoverScreen onStart={() => setScreen('question')} />;
      if (screen === 'question')  return (
        <QuestionScreen
          question={QUESTIONS[qIdx]} idx={qIdx} total={QUESTIONS.length}
          onAnswer={handleAnswer} chosen={chosen}
        />
      );
      if (screen === 'analyzing') return (
        <AnalyzingScreen onDone={() => setScreen('result')} />
      );
      if (screen === 'result')    return (
        <ResultScreen type={calcResult(finalAnswers)} onRestart={restart} />
      );
      return null;
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
